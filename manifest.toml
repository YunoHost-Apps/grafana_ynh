packaging_format = 2

id = "grafana"
name = "Grafana"
description.en = "Metric & analytic dashboards for monitoring"
description.fr = "Tableaux de bord de supervision"

version = "13.3.1~ynh1"

maintainers = ["ewilly"]

[upstream]
license = "AGPL-3.0-only"
website = "https://grafana.com/"
demo = "https://play.grafana.org"
code = "https://github.com/grafana/grafana"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = [ "amd64", "arm64", "armhf" ]
multi_instance = false

ldap = true
sso = true

disk = "800M"
ram.build = "200M"
ram.runtime = "200M"

[install]
	[install.domain]
	type = "domain"

	[install.path]
	type = "path"
	default = "/grafana"

	[install.init_main_permission]
	type = "group"
	default = "visitors"

[resources]

	[resources.sources]

	[resources.sources.main]
	# Just used for autoupdate alert
	url = "https://github.com/grafana/grafana/releases/download/v13.3.1/grafana_13.3.1_42849527790_linux_arm64.rpm"
	sha256 = "05ab0727686e44522d10f604f534b64a85ebf834cd7d6246ac016c6b1cefd1e1"

	autoupdate.strategy = "latest_github_release"
	autoupdate.asset = "^grafana_.*_linux_arm64.rpm$"

	[resources.sources.standalone]
	amd64.url = "https://dl.grafana.com/grafana/release/13.3.1/grafana_13.3.1_42849527790_linux_amd64.tar.gz"
	amd64.sha256 = "6acf8939dd2f73332cbcafc27a33973fb1115b8867e7ffa3223c6e2ecbed8531"
	arm64.url = "https://dl.grafana.com/grafana/release/13.3.1/grafana_13.3.1_42849527790_linux_arm64.tar.gz"
	arm64.sha256 = "a96fa3dfe94eebb036e53bb4c9c19a9b35bb19fb42f788baf17000f8b6972b33"
	armhf.url = "https://dl.grafana.com/grafana/release/13.3.1/grafana_13.3.1_42849527790_linux_arm-7.tar.gz"
	armhf.sha256 = "889d240c242195209b419498a0e4d54272645238c4582fe2b240419b97e42e06"

	rename = "grafana"

	[resources.system_user]
	allow_email = true

	[resources.install_dir]

	[resources.data_dir]

	[resources.ports]
    main.default = 3000

	[resources.permissions]
	main.url = "/"

	[resources.apt]
	packages = "mariadb-server"

	[resources.database]
	type = "mysql"
