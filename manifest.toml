packaging_format = 2

id = "grafana"
name = "Grafana"
description.en = "Metric & analytic dashboards for monitoring"
description.fr = "Tableaux de bord de supervision"

version = "13.3.0~ynh1"

maintainers = ["ewilly"]

[upstream]
license = "AGPL-3.0-only"
website = "https://grafana.com/"
demo = "https://play.grafana.org"
code = "https://github.com/grafana/grafana"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = [ "amd64", "arm64", "armhf" ]
multi_instance = false

ldap = true
sso = true

disk = "800M"
ram.build = "200M"
ram.runtime = "200M"

[install]
	[install.domain]
	type = "domain"

	[install.path]
	type = "path"
	default = "/grafana"

	[install.init_main_permission]
	type = "group"
	default = "visitors"

[resources]

	[resources.sources]

	[resources.sources.main]
	# Just used for autoupdate alert
	url = "https://github.com/grafana/grafana/releases/download/v13.3.0/grafana_13.3.0_40412481033_linux_arm64.rpm"
	sha256 = "086e5a3f00f37f88f0ded594e50311b861ce92161ead20a5bf5754940d3f53ff"

	autoupdate.strategy = "latest_github_release"
	autoupdate.asset = "^grafana_.*_linux_arm64.rpm$"

	[resources.sources.standalone]
	amd64.url = "https://dl.grafana.com/grafana/release/13.2.4/grafana_13.2.4_38252365904_linux_amd64.tar.gz"
	amd64.sha256 = "c48765988fd88572607e4ea670251af8a8e64ab3e360d0f3cf67a6f3587b92ab"
	arm64.url = "https://dl.grafana.com/grafana/release/13.2.4/grafana_13.2.4_38252365904_linux_arm64.tar.gz"
	arm64.sha256 = "9517a0d21e2706b54521fbd720803698bba42859ca179e9905cc6b8fb05d67ab"
	armhf.url = "https://dl.grafana.com/grafana/release/13.2.4/grafana_13.2.4_38252365904_linux_arm-7.tar.gz"
	armhf.sha256 = "e157812666d3a275f43452c83eefd8d0a5bf9c067275e8a7a7d5b0b579d169cb"

	rename = "grafana"

	[resources.system_user]
	allow_email = true

	[resources.install_dir]

	[resources.data_dir]

	[resources.ports]
    main.default = 3000

	[resources.permissions]
	main.url = "/"

	[resources.apt]
	packages = "mariadb-server"

	[resources.database]
	type = "mysql"
