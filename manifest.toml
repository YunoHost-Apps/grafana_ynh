packaging_format = 2

id = "grafana"
name = "Grafana"
description.en = "Metric & analytic dashboards for monitoring"
description.fr = "Tableaux de bord de supervision"

version = "13.3.2~ynh1"

maintainers = ["ewilly"]

[upstream]
license = "AGPL-3.0-only"
website = "https://grafana.com/"
demo = "https://play.grafana.org"
code = "https://github.com/grafana/grafana"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = [ "amd64", "arm64", "armhf" ]
multi_instance = false

ldap = true
sso = true

disk = "800M"
ram.build = "200M"
ram.runtime = "200M"

[install]
	[install.domain]
	type = "domain"

	[install.path]
	type = "path"
	default = "/grafana"

	[install.init_main_permission]
	type = "group"
	default = "visitors"

[resources]

	[resources.sources]

	[resources.sources.main]
	# Just used for autoupdate alert
	url = "https://github.com/grafana/grafana/releases/download/v13.3.2/grafana_13.3.2_44555861735_linux_arm64.rpm"
	sha256 = "30739b717e3aba00a811777c2e9720374884f76f510dad94cca9fbb7c8cf0146"

	autoupdate.strategy = "latest_github_release"
	autoupdate.asset = "^grafana_.*_linux_arm64.rpm$"

	[resources.sources.standalone]
	amd64.url = "https://dl.grafana.com/grafana/release/13.3.2/grafana_13.3.2_44555861735_linux_amd64.tar.gz"
	amd64.sha256 = "e6f06cf4ad96a4809294c2e78d3ebe6bc42a79bff36ffe35eefbe502fc19aa87"
	arm64.url = "https://dl.grafana.com/grafana/release/13.3.2/grafana_13.3.2_44555861735_linux_arm64.tar.gz"
	arm64.sha256 = "366f33263bf92a615644b129cb1f465eb32d632e48c6157c1831ca0194385a56"
	armhf.url = "https://dl.grafana.com/grafana/release/13.3.2/grafana_13.3.2_44555861735_linux_arm-7.tar.gz"
	armhf.sha256 = "e47164b3111763057c9477f3c5730c63bde68a6eb3e0a4a9ea302101f1a2fae5"

	rename = "grafana"

	[resources.system_user]
	allow_email = true

	[resources.install_dir]

	[resources.data_dir]

	[resources.ports]
    main.default = 3000

	[resources.permissions]
	main.url = "/"

	[resources.apt]
	packages = "mariadb-server"

	[resources.database]
	type = "mysql"
